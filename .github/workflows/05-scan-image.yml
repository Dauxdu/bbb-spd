name: "Stage 7: Scan Image"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-image:
    name: Trivy image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Docker image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ github.sha }}

      - name: Unpack OCI image layout
        run: |
          mkdir -p image-oci
          tar -xf image.tar -C image-oci

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.70.0 \
            image \
            --input /src/image-oci \
            --ignorefile /src/.trivyignore \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --format table \
            --skip-version-check

      - name: Export Trivy image scan to SARIF
        id: trivy_image_sarif
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.70.0 \
            image \
            --input /src/image-oci \
            --ignorefile /src/.trivyignore \
            --severity CRITICAL,HIGH \
            --format sarif \
            --output /src/trivy-image.sarif \
            --skip-version-check

      - name: Upload Trivy image SARIF to GitHub
        if: always() && steps.trivy_image_sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
