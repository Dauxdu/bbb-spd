name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "docker/**"
      - "server.js"
      - "*.json"
      - "*.yml"
      - "*.js"

jobs:
  lint:
    name: ESLint
    uses: ./.github/workflows/lint.yml

  build:
    name: Build & Security Scan
    needs: lint
    uses: ./.github/workflows/build.yml
