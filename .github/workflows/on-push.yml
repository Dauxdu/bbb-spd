name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "docker/**"
      - ".github/**"
      - ".trivyignore"
      - ".dockerignore"
      - "server.js"
      - "*.json"
      - "*.yml"
      - "*.js"
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "docker/**"
      - ".github/**"
      - ".trivyignore"
      - ".dockerignore"
      - "server.js"
      - "*.json"
      - "*.yml"
      - "*.js"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  build:
    name: Build & Security Scan
    needs: lint
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      security-events: write
