name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "docker/**"
      - ".github/**"
      - ".trivyignore"
      - ".dockerignore"
      - "server.js"
      - "*.json"
      - "*.yml"
      - "*.js"
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "docker/**"
      - ".github/**"
      - ".trivyignore"
      - ".dockerignore"
      - "server.js"
      - "*.json"
      - "*.yml"
      - "*.js"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Stage 1-2: Lint & SAST"
    uses: ./.github/workflows/01-lint.yml
    permissions:
      contents: read
      security-events: write

  secrets:
    name: "Stage 3: Secret Scan"
    uses: ./.github/workflows/02-secrets.yml
    permissions:
      contents: read

  dependencies:
    name: "Stage 4: Dependency Scan"
    uses: ./.github/workflows/03-dependencies.yml
    permissions:
      contents: read
      security-events: write

  build:
    name: "Stage 6: Build & Attestations"
    needs: [lint, secrets, dependencies]
    uses: ./.github/workflows/04-build.yml
    permissions:
      contents: read

  scan-image:
    name: "Stage 7: Scan Image"
    needs: build
    uses: ./.github/workflows/05-scan-image.yml
    permissions:
      contents: read
      security-events: write
