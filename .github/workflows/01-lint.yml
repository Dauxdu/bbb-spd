name: "Stage 1: Lint & SAST"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  hadolint:
    name: Hadolint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep full scan
        id: semgrep_scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.160.0 \
            semgrep scan \
              --config p/nodejs \
              --config p/security-audit \
              --config p/dockerfile \
              --config p/secrets \
              --exclude "*.sarif" \
              --sarif \
              --output /src/semgrep.sarif \
              --verbose \
              /src

      - name: Gate on ERROR-severity findings
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.160.0 \
            semgrep scan \
              --config p/nodejs \
              --config p/security-audit \
              --config p/dockerfile \
              --config p/secrets \
              --exclude "*.sarif" \
              --severity ERROR \
              --error \
              /src

      - name: Upload Semgrep SARIF to GitHub
        if: always() && steps.semgrep_scan.outcome == 'success'
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast
