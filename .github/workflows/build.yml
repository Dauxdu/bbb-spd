name: Build & Scan Docker Image

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Semgrep SAST scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep:1.160.0 \
            semgrep scan \
              --config p/nodejs \
              --config p/security-audit \
              --config p/dockerfile \
              --config p/secrets \
              --error \
              --sarif \
              --output /src/semgrep.sarif \
              --verbose \
              /src

      - name: Upload Semgrep SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Export Trivy fs scan to SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy fs SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning

      - name: Build Docker image
        run: |
          docker build \
            -t "inchange/${{ vars.DOCKER_IMAGE }}:latest" \
            -t "inchange/${{ vars.DOCKER_IMAGE }}:${{ github.sha }}" \
            -f docker/Dockerfile .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "inchange/${{ vars.DOCKER_IMAGE }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Export Trivy image scan to SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "inchange/${{ vars.DOCKER_IMAGE }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-image.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy image SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "inchange/${{ vars.DOCKER_IMAGE }}:${{ github.sha }}"
          format: "cyclonedx"
          output: "sbom.cdx.json"

      - name: Save Docker image
        run: docker save "inchange/${{ vars.DOCKER_IMAGE }}:${{ github.sha }}" -o "${{ vars.DOCKER_IMAGE }}-${{ github.sha }}.tar"

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ vars.DOCKER_IMAGE }}-${{ github.sha }}
          path: ${{ vars.DOCKER_IMAGE }}-${{ github.sha }}.tar
          retention-days: 1

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 7
